<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJ-Tech17 | Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #10131c;
            font-family: Arial, sans-serif;
            color: white;
        }

        .card {
            width: 320px;
            padding: 30px;
            background: #1b2230;
            border-radius: 18px;
            text-align: center;
            border: 1px solid #303b50;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin: 10px 0;
        }

        .bio {
            color: #b9c3d4;
            font-size: 14px;
            line-height: 1.6;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .skill {
            background: #29364c;
            color: #8fc7ff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">
        <img
            src="https://api.dicebear.com/9.x/initials/svg?seed=CJ"
            alt="Profile placeholder"
            class="profile-img"
        >

        <h1>CJ-Tech17</h1>

        <p class="bio">
            Aspiring software developer interested in web development,
            technology, and building useful digital projects.
        </p>

        <div class="skills">
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill">WordPress</span>
            <span class="skill">Python</span>
        </div>
    </div>

</body>
  </html>
